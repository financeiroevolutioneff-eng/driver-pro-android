name: Build Driver Pro v22 Weather Permanent

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk-v22-weather-permanent.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRIVER_PRO_KEYSTORE_PATH: ${{ github.workspace }}/driver-pro-release.jks
      DRIVER_PRO_STORE_PASSWORD: ${{ secrets.DRIVER_PRO_STORE_PASSWORD }}
      DRIVER_PRO_KEY_PASSWORD: ${{ secrets.DRIVER_PRO_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate permanent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DRIVER_PRO_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$DRIVER_PRO_STORE_PASSWORD"
          test -n "$DRIVER_PRO_KEY_PASSWORD"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DRIVER_PRO_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$DRIVER_PRO_KEYSTORE_PATH"
          test -s "$DRIVER_PRO_KEYSTORE_PATH"

      - name: Detect permanent signing alias
        shell: bash
        run: |
          ACTUAL_ALIAS="$(keytool -list -v -keystore "$DRIVER_PRO_KEYSTORE_PATH" -storepass "$DRIVER_PRO_STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          if [ -z "$ACTUAL_ALIAS" ]; then
            ACTUAL_ALIAS="$(keytool -list -keystore "$DRIVER_PRO_KEYSTORE_PATH" -storepass "$DRIVER_PRO_STORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}')"
          fi
          test -n "$ACTUAL_ALIAS"
          echo "DRIVER_PRO_KEY_ALIAS=$ACTUAL_ALIAS" >> "$GITHUB_ENV"
          echo "Permanent signing alias detected."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare base Driver Pro Android
        shell: bash
        run: |
          curl -fsSL "https://nbsrkkonqqfuualojzxq.supabase.co/functions/v1/driver-pro-apk-bootstrap?key=v16" -o bootstrap.sh
          bash bootstrap.sh

      - name: Restore proven v21 sources
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/financeiroevolutioneff-eng/driver-pro-android/main/.github/workflows/build-apk-v21-permanent-signed-corrected.yml" -o v21-source.yml
          MAIN_B64="$(sed -n 's/^          MAIN_B64: //p' v21-source.yml | head -1)"
          PUSH_B64="$(sed -n 's/^          PUSH_B64: //p' v21-source.yml | head -1)"
          MSG_B64="$(sed -n 's/^          MSG_B64: //p' v21-source.yml | head -1)"
          GRADLE_B64="$(sed -n 's/^          GRADLE_B64: //p' v21-source.yml | head -1)"
          test -n "$MAIN_B64"
          test -n "$PUSH_B64"
          test -n "$MSG_B64"
          test -n "$GRADLE_B64"
          printf '%s' "$MAIN_B64" | base64 -d > app/src/main/java/com/driverpro/app/MainActivity.java
          printf '%s' "$PUSH_B64" | base64 -d > app/src/main/java/com/driverpro/app/PushBridge.java
          printf '%s' "$MSG_B64" | base64 -d > app/src/main/java/com/driverpro/app/DriverProMessagingService.java
          printf '%s' "$GRADLE_B64" | base64 -d > app/build.gradle

      - name: Upgrade Driver Pro to v22 Weather
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main_path = Path("app/src/main/java/com/driverpro/app/MainActivity.java")
          push_path = Path("app/src/main/java/com/driverpro/app/PushBridge.java")
          gradle_path = Path("app/build.gradle")

          main = main_path.read_text(encoding="utf-8")
          if "dp21FlightCard" not in main:
              raise SystemExit("Expected v21 flight source not found")

          # v22 keeps the proven v21 shell and adds weather without changing the WebView origin.
          main = main.replace("&v=21", "&v=22")
          main = main.replace("injectStableUi();", "injectStableUi();\n        injectWeatherUi();")

          weather_method = r'''
            private void injectWeatherUi() {
              if (webView == null) return;
              String js =
                "(function(){try{" +
                "if(document.getElementById('dp22-weather-loader'))return;" +
                "var s=document.createElement('script');" +
                "s.id='dp22-weather-loader';" +
                "s.src='https://nbsrkkonqqfuualojzxq.supabase.co/functions/v1/driver-pro-ui-v22?v=1';" +
                "s.async=true;" +
                "(document.head||document.documentElement).appendChild(s);" +
                "}catch(e){console.log('Driver Pro weather',e);}})();";
              webView.evaluateJavascript(js, null);
            }
          '''
          pos = main.rfind("\n}")
          if pos < 0:
              raise SystemExit("Could not locate MainActivity closing brace")
          main = main[:pos] + "\n" + weather_method + main[pos:]
          main_path.write_text(main, encoding="utf-8")

          push = push_path.read_text(encoding="utf-8")
          push = push.replace("1.0.21", "1.0.22").replace("android-v21", "android-v22")
          push_path.write_text(push, encoding="utf-8")

          gradle = gradle_path.read_text(encoding="utf-8")
          gradle = gradle.replace("versionCode 21", "versionCode 22")
          gradle = gradle.replace("versionName '1.0.21'", "versionName '1.0.22'")
          gradle_path.write_text(gradle, encoding="utf-8")
          PY

          grep -q "versionCode 22" app/build.gradle
          grep -q "versionName '1.0.22'" app/build.gradle
          grep -q "dp21FlightCard" app/src/main/java/com/driverpro/app/MainActivity.java
          grep -q "injectWeatherUi" app/src/main/java/com/driverpro/app/MainActivity.java
          grep -q "driver-pro-ui-v22" app/src/main/java/com/driverpro/app/MainActivity.java

      - name: Correct Driver Pro logo extension
        shell: bash
        run: |
          if [ -f app/src/main/res/drawable/driver_pro_logo.png ]; then
            mv app/src/main/res/drawable/driver_pro_logo.png app/src/main/res/drawable/driver_pro_logo.webp
          fi
          test -f app/src/main/res/drawable/driver_pro_logo.webp

      - name: Build permanently signed APK v22
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Driver-Pro-v22-Weather-Permanent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-v22-Weather-Permanent-APK
          path: Driver-Pro-v22-Weather-Permanent.apk
          retention-days: 30
