name: Build Driver Pro v25 Navigation

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRIVER_PRO_KEYSTORE_PATH: ${{ github.workspace }}/driver-pro-release.jks
      DRIVER_PRO_STORE_PASSWORD: ${{ secrets.DRIVER_PRO_STORE_PASSWORD }}
      DRIVER_PRO_KEY_PASSWORD: ${{ secrets.DRIVER_PRO_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DRIVER_PRO_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$DRIVER_PRO_STORE_PASSWORD"
          test -n "$DRIVER_PRO_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$DRIVER_PRO_KEYSTORE_PATH"
          test -s "$DRIVER_PRO_KEYSTORE_PATH"

      - name: Detect permanent signing alias
        shell: bash
        run: |
          ACTUAL_ALIAS="$(keytool -list -v -keystore "$DRIVER_PRO_KEYSTORE_PATH" -storepass "$DRIVER_PRO_STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          if [ -z "$ACTUAL_ALIAS" ]; then
            ACTUAL_ALIAS="$(keytool -list -keystore "$DRIVER_PRO_KEYSTORE_PATH" -storepass "$DRIVER_PRO_STORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}')"
          fi
          test -n "$ACTUAL_ALIAS"
          echo "DRIVER_PRO_KEY_ALIAS=$ACTUAL_ALIAS" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare base Driver Pro Android
        shell: bash
        run: |
          curl -fsSL "https://nbsrkkonqqfuualojzxq.supabase.co/functions/v1/driver-pro-apk-bootstrap?key=v16" -o bootstrap.sh
          bash bootstrap.sh

      - name: Restore proven v21 sources
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/financeiroevolutioneff-eng/driver-pro-android/main/.github/workflows/build-apk-v21-permanent-signed-corrected.yml" -o v21-source.yml
          MAIN_B64="$(sed -n 's/^          MAIN_B64: //p' v21-source.yml | head -1)"
          PUSH_B64="$(sed -n 's/^          PUSH_B64: //p' v21-source.yml | head -1)"
          MSG_B64="$(sed -n 's/^          MSG_B64: //p' v21-source.yml | head -1)"
          GRADLE_B64="$(sed -n 's/^          GRADLE_B64: //p' v21-source.yml | head -1)"
          test -n "$MAIN_B64" && test -n "$PUSH_B64" && test -n "$MSG_B64" && test -n "$GRADLE_B64"
          printf '%s' "$MAIN_B64" | base64 -d > app/src/main/java/com/driverpro/app/MainActivity.java
          printf '%s' "$PUSH_B64" | base64 -d > app/src/main/java/com/driverpro/app/PushBridge.java
          printf '%s' "$MSG_B64" | base64 -d > app/src/main/java/com/driverpro/app/DriverProMessagingService.java
          printf '%s' "$GRADLE_B64" | base64 -d > app/build.gradle

      - name: Apply v25 weather + navigation UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          mp = Path("app/src/main/java/com/driverpro/app/MainActivity.java")
          pp = Path("app/src/main/java/com/driverpro/app/PushBridge.java")
          gp = Path("app/build.gradle")

          main = mp.read_text(encoding="utf-8")
          main = main.replace("&v=21", "&v=25")
          main = main.replace("injectStableUi();", "injectStableUi();\n        injectWeatherNativeUi();\n        injectNavigationNativeUi();")

          method = r'''
            private void injectWeatherNativeUi() {
              if (webView == null) return;
              String js =
                "(function(){try{" +
                "if(document.getElementById('dp24Weather'))return;" +
                "var st=document.createElement('style');st.id='dp24WeatherStyle';st.textContent=" +
                "'#dp24Weather{margin:14px 16px;padding:16px 18px;border:1px solid #315b7d;border-radius:22px;background:linear-gradient(135deg,#0e3c60,#0a2742);color:#fff;box-shadow:0 8px 24px #0003;font-family:system-ui;cursor:pointer}'+" +
                "'#dp24Weather .r{display:flex;align-items:center;justify-content:space-between;gap:12px}#dp24Weather .temp{font-size:38px;font-weight:850}#dp24Weather .ico{font-size:44px}#dp24Weather .muted{opacity:.72;font-size:13px;margin-top:7px}'+" +
                "'#dp24WxModal{position:fixed;inset:0;background:#000a;z-index:2147483646;display:flex;align-items:flex-end}#dp24WxSheet{width:100%;max-height:88vh;overflow:auto;background:#07182a;color:#fff;border-radius:28px 28px 0 0;padding:20px;font-family:system-ui}'+" +
                "'#dp24WxClose{float:right;width:48px;height:48px;border-radius:50%;border:1px solid #416b8c;background:#0d2a46;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:0 4px 12px #0003}.dp24days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.dp24day{background:#0d2a46;border:1px solid #315b7d;border-radius:16px;padding:12px;text-align:center}.dp24hours{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px}.dp24hour{min-width:92px;background:#0d2a46;border:1px solid #315b7d;border-radius:14px;padding:10px;text-align:center}';document.head.appendChild(st);" +
                "function icon(t){t=String(t||'').toLowerCase();if(t.includes('tempest'))return '⛈️';if(t.includes('chuva')||t.includes('pancada')||t.includes('garoa'))return '🌧️';if(t.includes('nuv')||t.includes('encob'))return '☁️';if(t.includes('sol')||t.includes('claro'))return '☀️';return '🌤️';}" +
                "function cur(d){var x=d&&d.current||{};return{t:x.temperature??'--',f:x.feels_like,h:x.humidity,c:x.condition||'Clima agora'};}" +
                "function openWx(d){document.getElementById('dp24WxModal')?.remove();var c=cur(d),m=document.createElement('div');m.id='dp24WxModal';var hrs=(d.remainingToday||[]).slice(0,8).map(function(h){var tm=String(h.time||'').split(' ')[1]||'';return '<div class=dp24hour><b>'+tm+'</b><div style=font-size:24px;margin:6px>'+icon(h.condition)+'</div><div>'+h.temperature+'°</div><div style=font-size:11px;opacity:.75>💧 '+(h.rain_probability??0)+'%</div></div>';}).join('');var cards=(d.forecast||[]).slice(0,3).map(function(x,i){var q=x.temperature||{},mn=q.min??'--',mx=q.max??'--',rp=x.rain&&x.rain.probability,label=i===0?'Hoje':i===1?'Amanhã':'Dia 3';return '<div class=dp24day><b>'+label+'</b><div style=font-size:28px;margin:8px>'+icon(x.condition)+'</div><div>'+mn+'° / <b>'+mx+'°</b></div>'+(rp!=null?'<div style=font-size:12px;margin-top:6px>💧 '+rp+'%</div>':'')+'</div>';}).join('');m.innerHTML='<div id=dp24WxSheet><button id=dp24WxClose aria-label=Fechar>×</button><div style=font-size:13px;opacity:.7>📍 '+((d.locale&&d.locale.name)||'Vinhedo')+' • '+((d.locale&&d.locale.state)||'SP')+'</div><div style=font-size:28px;font-weight:850;margin-top:3px>Previsão do tempo</div><div style=display:flex;align-items:center;gap:14px;margin-top:15px><div style=font-size:56px>'+icon(c.c)+'</div><div><div style=font-size:42px;font-weight:850>'+c.t+'°</div><div>'+c.c+'</div>'+(c.f!=null?'<div style=opacity:.7>Sensação '+c.f+'°</div>':'')+(c.h!=null?'<div style=opacity:.7>Umidade '+c.h+'%</div>':'')+'</div></div>'+(hrs?'<div style=margin-top:18px;font-weight:750>Restante de hoje</div><div class=dp24hours>'+hrs+'</div>':'')+'<div class=dp24days>'+cards+'</div><div style=opacity:.5;font-size:11px;text-align:center;margin-top:14px>Dados: WeatherAPI</div></div>';document.body.appendChild(m);document.getElementById('dp24WxClose').onclick=function(e){e.stopPropagation();m.remove()};m.onclick=function(e){if(e.target===m)m.remove()};}" +
                "var c=document.createElement('div');c.id='dp24Weather';c.innerHTML='<div class=r><div><div style=font-size:12px;color:#f4c94c;font-weight:700>CLIMA AGORA</div><div id=dp24Cond style=font-size:17px;font-weight:700;margin-top:3px>Carregando clima…</div><div class=muted id=dp24Meta>Vinhedo • SP</div></div><div class=ico id=dp24Ico>🌤️</div><div class=temp id=dp24Temp>--°</div></div><div class=muted>Toque para ver o restante do dia e próximos dias</div>';" +
                "var f=document.getElementById('dp21FlightCard'),h=document.querySelector('.card.hero');if(f&&f.parentNode)f.parentNode.insertBefore(c,f);else if(h&&h.parentNode)h.parentNode.insertBefore(c,h.nextSibling);else(document.querySelector('main')||document.body).prepend(c);" +
                "function fail(msg){document.getElementById('dp24Cond').textContent='Clima indisponível';document.getElementById('dp24Meta').textContent=msg||'Tente novamente';}" +
                "if(typeof edge!=='function'){fail('Conexão do clima indisponível');return;}" +
                "edge('weather-climatempo',{city:'Vinhedo',state:'SP'}).then(function(d){if(!d||d.ok===false){fail((d&&d.message)||'Clima indisponível');return;}var x=cur(d);document.getElementById('dp24Temp').textContent=x.t+'°';document.getElementById('dp24Cond').textContent=x.c;document.getElementById('dp24Ico').textContent=icon(x.c);document.getElementById('dp24Meta').textContent=((d.locale&&d.locale.name)||'Vinhedo')+' • '+((d.locale&&d.locale.state)||'SP')+(x.h!=null?' • Umidade '+x.h+'%':'');c.onclick=function(){openWx(d)};}).catch(function(e){fail((e&&e.message)||'Clima indisponível');});" +
                "}catch(e){console.log('dp24 weather',e);}})();";
              webView.evaluateJavascript(js, null);
            }
          '''

          nav_method = r'''
            private void injectNavigationNativeUi() {
              if (webView == null) return;
              String js =
                "(function(){try{" +
                "if(document.getElementById('dp25NavCard'))return;" +
                "var st=document.createElement('style');st.id='dp25NavStyle';st.textContent=" +
                "'#dp25NavCard{margin:14px 16px;padding:16px 18px;border:1px solid #8f7837;border-radius:22px;background:linear-gradient(135deg,#091d31,#102c48);color:#fff;box-shadow:0 8px 24px #0003;font-family:system-ui;cursor:pointer}'+" +
                "'#dp25NavModal{position:fixed;inset:0;background:#000b;z-index:2147483647;display:flex;align-items:flex-end}#dp25NavSheet{width:100%;max-height:92vh;overflow:auto;background:#07182a;color:#fff;border-radius:28px 28px 0 0;padding:20px;font-family:system-ui}'+" +
                "'.dp25field{position:relative;margin:12px 0}.dp25field label{font-size:12px;color:#f3c95d;font-weight:750;display:block;margin-bottom:6px}.dp25input{width:100%;box-sizing:border-box;background:#0d2a46;color:#fff;border:1px solid #315b7d;border-radius:14px;padding:14px;font-size:16px;outline:none}.dp25suggest{position:absolute;left:0;right:0;top:72px;background:#fff;color:#10253c;border-radius:14px;overflow:hidden;z-index:8;box-shadow:0 8px 24px #0006}.dp25sug{padding:12px;border-bottom:1px solid #e7edf2}.dp25stop{display:flex;gap:8px;align-items:flex-end}.dp25stop .dp25field{flex:1}.dp25btn{border:0;border-radius:14px;padding:13px 15px;font-weight:800}.dp25gold{background:#e4b94e;color:#102033}.dp25blue{background:#123d63;color:#fff;border:1px solid #315b7d}.dp25danger{background:#522634;color:#fff}.dp25actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.dp25close{float:right;width:48px;height:48px;border-radius:50%;border:1px solid #416b8c;background:#0d2a46;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}';document.head.appendChild(st);" +
                "function esc(s){return String(s||'').replace(/[&<>\\\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#39;'}[c]})}" +
                "function token(){return 'dp25-'+Date.now()+'-'+Math.random().toString(36).slice(2)}" +
                "function search(inp,box,state){var q=inp.value.trim();if(q.length<2){box.innerHTML='';return;}clearTimeout(inp._t);inp._t=setTimeout(function(){if(typeof edge!=='function')return;edge('route-places',{action:'search',input:q,sessionToken:state.session}).then(function(d){if(!d||!d.ok){box.innerHTML='<div class=dp25sug>Busca indisponível no momento</div>';return;}box.innerHTML=(d.items||[]).map(function(x){return '<div class=dp25sug data-id=\"'+esc(x.place_id)+'\"><b>'+esc(x.main_text||x.text)+'</b><div style=font-size:12px;opacity:.7>'+esc(x.secondary_text||'')+'</div></div>'}).join('');Array.from(box.querySelectorAll('.dp25sug[data-id]')).forEach(function(el){el.onclick=function(){var id=el.getAttribute('data-id');edge('route-places',{action:'details',place_id:id}).then(function(r){if(r&&r.ok&&r.place){state.place=r.place;inp.value=r.place.address||r.place.name||inp.value;box.innerHTML='';}})}});}).catch(function(){box.innerHTML='<div class=dp25sug>Busca indisponível</div>'});},250)}" +
                "function field(label,value,state){var w=document.createElement('div');w.className='dp25field';w.innerHTML='<label>'+label+'</label><input class=dp25input value=\"'+esc(value||'')+'\" placeholder=\"Digite um endereço ou local\"><div class=dp25suggest></div>';var i=w.querySelector('input'),b=w.querySelector('.dp25suggest');i.oninput=function(){state.place=null;search(i,b,state)};return w}" +
                "function routeUrl(provider,origin,stops,dest){var o=origin.place||{address:origin.input.value},d=dest.place||{address:dest.input.value};var ov=(o.lat!=null&&o.lng!=null)?o.lat+','+o.lng:o.address;var dv=(d.lat!=null&&d.lng!=null)?d.lat+','+d.lng:d.address;var wp=stops.map(function(s){var p=s.place||{address:s.input.value};return (p.lat!=null&&p.lng!=null)?p.lat+','+p.lng:p.address}).filter(Boolean);if(provider==='waze'){var target=wp.length?wp[0]:dv;return 'https://waze.com/ul?q='+encodeURIComponent(target)+'&navigate=yes';}return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(ov)+'&destination='+encodeURIComponent(dv)+(wp.length?'&waypoints='+encodeURIComponent(wp.join('|')):'')+'&travelmode=driving';}" +
                "function openNav(){document.getElementById('dp25NavModal')?.remove();var m=document.createElement('div');m.id='dp25NavModal';m.innerHTML='<div id=dp25NavSheet><button class=dp25close aria-label=Fechar>×</button><div style=font-size:12px;color:#f3c95d;font-weight:800>ROTA DA CORRIDA</div><div style=font-size:27px;font-weight:850;margin:3px 0 4px>Iniciar transporte</div><div style=opacity:.7;font-size:13px>Busque endereços, adicione paradas e abra a rota.</div><div id=dp25Fields></div><button id=dp25Add class=\"dp25btn dp25blue\" style=width:100%;margin-top:5px>＋ Adicionar parada</button><div class=dp25actions><button id=dp25Maps class=\"dp25btn dp25gold\">Google Maps</button><button id=dp25Waze class=\"dp25btn dp25blue\">Waze</button></div><div style=font-size:11px;opacity:.55;margin-top:12px>As paradas são mantidas na ordem exibida.</div></div>';document.body.appendChild(m);var holder=m.querySelector('#dp25Fields'),stops=[];function mk(label,val){var state={session:token(),place:null,input:null};var f=field(label,val,state);state.input=f.querySelector('input');holder.appendChild(f);return state}var origin=mk('Origem',''),destWrap=document.createElement('div');var dest=mk('Destino final','');var destEl=holder.lastElementChild;holder.removeChild(destEl);destWrap.appendChild(destEl);holder.appendChild(destWrap);function renderStops(){Array.from(holder.querySelectorAll('.dp25stop')).forEach(function(x){x.remove()});stops.forEach(function(s,idx){var row=document.createElement('div');row.className='dp25stop';var f=field('Parada '+(idx+1),s.input?s.input.value:'',s);s.input=f.querySelector('input');row.appendChild(f);var del=document.createElement('button');del.className='dp25btn dp25danger';del.textContent='×';del.onclick=function(){stops.splice(idx,1);renderStops()};row.appendChild(del);holder.insertBefore(row,destWrap)});}m.querySelector('#dp25Add').onclick=function(){stops.push({session:token(),place:null,input:null});renderStops()};m.querySelector('.dp25close').onclick=function(){m.remove()};m.onclick=function(e){if(e.target===m)m.remove()};m.querySelector('#dp25Maps').onclick=function(){if(!origin.input.value.trim()||!dest.input.value.trim())return alert('Informe origem e destino.');window.location.href=routeUrl('maps',origin,stops,dest)};m.querySelector('#dp25Waze').onclick=function(){if(!dest.input.value.trim())return alert('Informe o destino.');window.location.href=routeUrl('waze',origin,stops,dest)};}" +
                "var c=document.createElement('div');c.id='dp25NavCard';c.innerHTML='<div style=display:flex;align-items:center;justify-content:space-between;gap:12px><div><div style=font-size:12px;color:#f3c95d;font-weight:800>NAVEGAÇÃO</div><div style=font-size:19px;font-weight:850;margin-top:3px>🗺️ Iniciar transporte</div><div style=font-size:13px;opacity:.72;margin-top:6px>Origem • paradas • destino final</div></div><div style=font-size:34px>➜</div></div>';var f=document.getElementById('dp21FlightCard'),w=document.getElementById('dp24Weather');if(f&&f.parentNode)f.parentNode.insertBefore(c,f.nextSibling);else if(w&&w.parentNode)w.parentNode.insertBefore(c,w.nextSibling);else(document.querySelector('main')||document.body).appendChild(c);c.onclick=openNav;" +
                "}catch(e){console.log('dp25 nav',e);}})();";
              webView.evaluateJavascript(js, null);
            }
          '''

          pos = main.rfind("\n}")
          if pos < 0:
              raise SystemExit("MainActivity closing brace not found")
          main = main[:pos] + "\n" + method + "\n" + nav_method + main[pos:]
          mp.write_text(main, encoding="utf-8")

          push = pp.read_text(encoding="utf-8").replace("1.0.21","1.0.25").replace("android-v21","android-v25")
          pp.write_text(push, encoding="utf-8")

          gradle = gp.read_text(encoding="utf-8").replace("versionCode 21","versionCode 25").replace("versionName '1.0.21'","versionName '1.0.25'")
          gp.write_text(gradle, encoding="utf-8")
          PY

          grep -q "versionCode 25" app/build.gradle
          grep -q "versionName '1.0.25'" app/build.gradle
          grep -q "dp24WxClose" app/src/main/java/com/driverpro/app/MainActivity.java
          grep -q "Dados: WeatherAPI" app/src/main/java/com/driverpro/app/MainActivity.java
          grep -q "dp25NavCard" app/src/main/java/com/driverpro/app/MainActivity.java
          grep -q "Adicionar parada" app/src/main/java/com/driverpro/app/MainActivity.java

      - name: Correct Driver Pro logo extension
        shell: bash
        run: |
          if [ -f app/src/main/res/drawable/driver_pro_logo.png ]; then
            mv app/src/main/res/drawable/driver_pro_logo.png app/src/main/res/drawable/driver_pro_logo.webp
          fi
          test -f app/src/main/res/drawable/driver_pro_logo.webp

      - name: Build permanently signed APK v25
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Driver-Pro-v25-Navigation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-v25-Navigation-APK
          path: Driver-Pro-v25-Navigation.apk
          retention-days: 30
