name: Build Driver Pro v21 Permanent Signed

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRIVER_PRO_KEYSTORE_PATH: ${{ github.workspace }}/driver-pro-release.jks
      DRIVER_PRO_STORE_PASSWORD: ${{ secrets.DRIVER_PRO_STORE_PASSWORD }}
      DRIVER_PRO_KEY_ALIAS: ${{ secrets.DRIVER_PRO_KEY_ALIAS }}
      DRIVER_PRO_KEY_PASSWORD: ${{ secrets.DRIVER_PRO_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DRIVER_PRO_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$DRIVER_PRO_STORE_PASSWORD"
          test -n "$DRIVER_PRO_KEY_ALIAS"
          test -n "$DRIVER_PRO_KEY_PASSWORD"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DRIVER_PRO_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$DRIVER_PRO_KEYSTORE_PATH"
          test -s "$DRIVER_PRO_KEYSTORE_PATH"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare base Driver Pro Android
        run: |
          curl -fsSL "https://nbsrkkonqqfuualojzxq.supabase.co/functions/v1/driver-pro-apk-bootstrap?key=v16" -o bootstrap.sh
          bash bootstrap.sh

      - name: Apply v21 stable app
        shell: bash
        env:
          MAIN_B64: 
          PUSH_B64: 
          MSG_B64: 
          GRADLE_B64: 
        run: |
          printf '%s' "$MAIN_B64" | base64 -d > app/src/main/java/com/driverpro/app/MainActivity.java
          printf '%s' "$PUSH_B64" | base64 -d > app/src/main/java/com/driverpro/app/PushBridge.java
          printf '%s' "$MSG_B64" | base64 -d > app/src/main/java/com/driverpro/app/DriverProMessagingService.java
          printf '%s' "$GRADLE_B64" | base64 -d > app/build.gradle
          grep -q "versionCode 21" app/build.gradle
          grep -q "versionName '1.0.21'" app/build.gradle
          ! grep -q "pushdebug=1" app/src/main/java/com/driverpro/app/MainActivity.java
          ! grep -q "injectDiagnostics" app/src/main/java/com/driverpro/app/MainActivity.java
          grep -q "dp21FlightCard" app/src/main/java/com/driverpro/app/MainActivity.java

      - name: Build permanently signed APK v21
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Driver-Pro-v21-Permanent-Signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-v21-Permanent-Signed-APK
          path: Driver-Pro-v21-Permanent-Signed.apk
          retention-days: 30
