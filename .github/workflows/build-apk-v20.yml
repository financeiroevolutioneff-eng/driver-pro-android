name: Build Driver Pro v20 Push Diagnostics

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare base Driver Pro Android
        run: |
          curl -fsSL "https://nbsrkkonqqfuualojzxq.supabase.co/functions/v1/driver-pro-apk-bootstrap?key=v16" -o bootstrap.sh
          bash bootstrap.sh

      - name: Apply v20 push diagnostics fix
        shell: bash
        env:
          MAIN_B64: 
          PUSH_B64: 
          MSG_B64: 
          GRADLE_B64: 
        run: |
          printf '%s' "$MAIN_B64" | base64 -d > app/src/main/java/com/driverpro/app/MainActivity.java
          printf '%s' "$PUSH_B64" | base64 -d > app/src/main/java/com/driverpro/app/PushBridge.java
          printf '%s' "$MSG_B64" | base64 -d > app/src/main/java/com/driverpro/app/DriverProMessagingService.java
          printf '%s' "$GRADLE_B64" | base64 -d > app/build.gradle
          grep -q "versionCode 20" app/build.gradle
          grep -q "pushdebug=1" app/src/main/java/com/driverpro/app/MainActivity.java

      - name: Build APK v20
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Driver-Pro-v20-Push-Diagnostics.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-v20-Push-Diagnostics-APK
          path: Driver-Pro-v20-Push-Diagnostics.apk
          retention-days: 30
